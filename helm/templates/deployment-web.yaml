apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fairly.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app: {{ include "fairly.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "fairly.fullname" . }}-web
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "fairly.fullname" . }}-nginx
