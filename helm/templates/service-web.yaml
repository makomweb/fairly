apiVersion: v1
kind: Service
metadata:
  name: {{ include "fairly.fullname" . }}-web
spec:
  type: {{ .Values.service.web.type }}
  selector:
    app: {{ include "fairly.fullname" . }}-web
  ports:
    - port: {{ .Values.service.web.port }}
      targetPort: 80
      protocol: TCP
      name: http
      nodePort: {{ .Values.service.web.nodePort }}
